    function buildDieFace(container, value) {
        container.innerHTML = '';
        for (const [t, l] of DICE_DOTS[value]) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.style.top = t + '%'; dot.style.left = l + '%';
            dot.style.transform = 'translate(-50%,-50%)';
            container.appendChild(dot);
        }
    }

    function cleanupDealAnimation() {
        // Clear all pending timers
        for (const t of _animTimers) clearTimeout(t);
        _animTimers = [];
        if (_animInterval) { clearInterval(_animInterval); _animInterval = null; }
        const el = document.getElementById('dealAnimOverlay');
        if (el) el.remove();
    }

    function animTimer(fn, delay) {
        const id = setTimeout(fn, delay);
        _animTimers.push(id);
        return id;
    }

    function playDealAnimation(callback) {
        // Clean up any previous animation fully
        cleanupDealAnimation();

        const tableArea = document.getElementById('tableArea');
        const overlay = document.createElement('div');
        overlay.id = 'dealAnimOverlay';
        tableArea.appendChild(overlay);

        const rect = overlay.getBoundingClientRect();
        const W = rect.width, H = rect.height;
        const cx = W / 2, cy = H / 2;
        const TW = 20, TH = 28;
        const TOTAL = 144;
        const STACKS = 18;
        const D2R = Math.PI / 180;
        const TILT = 2.5;

        // Dice results (random for ceremony)
        const die1 = Math.floor(Math.random() * 6) + 1;
        const die2 = Math.floor(Math.random() * 6) + 1;
        const diceTotal = die1 + die2;
        const breakWall = (diceTotal - 1) % 4;
        const breakStack = diceTotal;

        const tiles = [];
        const frag = document.createDocumentFragment();

        // Create all 144 tiles scattered around center
        for (let i = 0; i < TOTAL; i++) {
            const el = document.createElement('div');
            el.className = 'anim-tile';
            const sx = cx + (Math.random() - 0.5) * 300 - TW / 2;
            const sy = cy + (Math.random() - 0.5) * 220 - TH / 2;
            const sr = Math.random() * 360;
            el.style.transform = `translate(${sx}px,${sy}px) rotate(${sr}deg)`;
            frag.appendChild(el);
            tiles.push(el);
        }
        overlay.appendChild(frag);

        // ── Phase 1: Fade in scattered tiles (0-300ms) ──
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                tiles.forEach(el => {
                    el.style.transition = 'opacity 0.3s ease';
                    el.style.opacity = '1';
                });
            });
        });

        // ── Phase 2a: First shuffle (500ms) ──
        animTimer(() => {
            tiles.forEach(el => {
                el.style.transition = 'transform 0.65s cubic-bezier(0.25,0.46,0.45,0.94)';
                const x = cx + (Math.random() - 0.5) * 340 - TW / 2;
                const y = cy + (Math.random() - 0.5) * 260 - TH / 2;
                const r = Math.random() * 360;
                el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg)`;
            });
        }, 500);

        // ── Phase 2b: Second shuffle (1250ms) ──
        animTimer(() => {
            tiles.forEach(el => {
                const x = cx + (Math.random() - 0.5) * 280 - TW / 2;
                const y = cy + (Math.random() - 0.5) * 200 - TH / 2;
                const r = Math.random() * 360;
                el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg)`;
            });
        }, 1250);

        // ── Phase 3: Form 4 slightly diagonal walls (2100ms) ──
        const inset = Math.min(W, H) * 0.22;
        const wallLen = Math.min(W * 0.42, H * 0.48, 380);
        const gap = wallLen / STACKS;
        const cosT = Math.cos(TILT * D2R);
        const sinT = Math.sin(TILT * D2R);

        const walls = [
            { wcx: cx, wcy: cy + inset, dx: cosT, dy: sinT, angle: TILT },
            { wcx: cx + inset, wcy: cy, dx: -sinT, dy: cosT, angle: 90 + TILT },
            { wcx: cx, wcy: cy - inset, dx: -cosT, dy: -sinT, angle: 180 + TILT },
            { wcx: cx - inset, wcy: cy, dx: sinT, dy: -cosT, angle: 270 + TILT },
        ];

        const tilePositions = [];

        animTimer(() => {
            tiles.forEach(el => {
                el.style.transition = 'transform 0.85s cubic-bezier(0.22,0.61,0.36,1)';
            });

            for (let w = 0; w < 4; w++) {
                const wall = walls[w];
                for (let s = 0; s < STACKS; s++) {
                    const offset = (-STACKS / 2 + s + 0.5) * gap;
                    const bx = wall.wcx + offset * wall.dx;
                    const by = wall.wcy + offset * wall.dy;

                    for (let layer = 0; layer < 2; layer++) {
                        const idx = w * 36 + s * 2 + layer;
                        if (idx >= TOTAL) break;
                        const lx = layer * -1;
                        const ly = layer * -3;
                        const tx = bx - TW / 2 + lx;
                        const ty = by - TH / 2 + ly;
                        tilePositions[idx] = { x: tx, y: ty, angle: wall.angle, wall: w, stack: s };
                        tiles[idx].style.transform = `translate(${tx}px,${ty}px) rotate(${wall.angle}deg)`;
                    }
                }
            }
        }, 2100);

        // ── Phase 4: Dice roll (3200ms) ──
        const diceContainer = document.createElement('div');
        diceContainer.className = 'dice-container';
        const dieEl1 = document.createElement('div');
        dieEl1.className = 'anim-die';
        const dieEl2 = document.createElement('div');
        dieEl2.className = 'anim-die';
        const totalLabel = document.createElement('div');
        totalLabel.className = 'dice-total';
        diceContainer.appendChild(dieEl1);
        diceContainer.appendChild(dieEl2);
        diceContainer.appendChild(totalLabel);
        overlay.appendChild(diceContainer);

        animTimer(() => {
            diceContainer.classList.add('show');
            diceContainer.classList.add('dice-rolling');
            _animInterval = setInterval(() => {
                buildDieFace(dieEl1, Math.floor(Math.random() * 6) + 1);
                buildDieFace(dieEl2, Math.floor(Math.random() * 6) + 1);
            }, 80);

            animTimer(() => {
                if (_animInterval) { clearInterval(_animInterval); _animInterval = null; }
                diceContainer.classList.remove('dice-rolling');
                buildDieFace(dieEl1, die1);
                buildDieFace(dieEl2, die2);
                animTimer(() => {
                    totalLabel.textContent = `Total: ${diceTotal}`;
                    totalLabel.classList.add('show');
                }, 300);
            }, 1000);
        }, 3200);

        // ── Phase 5: Show seat/wind assignments (4600ms) ──
        const WIND_DATA = {
            east:  { char: '東', eng: 'East' },
            south: { char: '南', eng: 'South' },
            west:  { char: '西', eng: 'West' },
            north: { char: '北', eng: 'North' }
        };

        const windPositions = [
            { x: cx, y: cy + inset + 55, anchorX: '-50%', anchorY: '0' },
            { x: cx + inset + 45, y: cy, anchorX: '0', anchorY: '-50%' },
            { x: cx, y: cy - inset - 55, anchorX: '-50%', anchorY: '-100%' },
            { x: cx - inset - 45, y: cy, anchorX: '-100%', anchorY: '-50%' },
        ];

        const windLabels = [];
        animTimer(() => {
            diceContainer.style.transition = 'opacity 0.3s ease';
            diceContainer.style.opacity = '0';

            const players = _lastRoomInfo ? _lastRoomInfo.players : null;

            for (let relSeat = 0; relSeat < 4; relSeat++) {
                const absSeat = (relSeat + mySeat) % 4;
                const player = players ? players[absSeat] : null;
                const wind = player ? player.seatWind : ['east','south','west','north'][absSeat];
                const wd = WIND_DATA[wind] || WIND_DATA.east;
                const pName = player ? player.name : '';

                const label = document.createElement('div');
                label.className = 'wind-label';
                const pos = windPositions[relSeat];
                label.style.left = pos.x + 'px';
                label.style.top = pos.y + 'px';
                label.style.transform = `translate(${pos.anchorX}, ${pos.anchorY}) scale(0.7)`;
                label.innerHTML = `<span class="wind-char">${wd.char}</span><span class="wind-name">${pName}</span>`;
                overlay.appendChild(label);
                windLabels.push(label);

                animTimer(() => {
                    label.classList.add('show');
                    label.style.transform = `translate(${pos.anchorX}, ${pos.anchorY}) scale(1)`;
                }, relSeat * 150);
            }
        }, 4600);

        // ── Phase 6: Wall break (5800ms) ──
        animTimer(() => {
            const bStack = Math.min(breakStack, STACKS - 2);
            for (let w = 0; w < 4; w++) {
                if (w !== breakWall) continue;
                const wall = walls[w];
                for (let s = 0; s < STACKS; s++) {
                    for (let layer = 0; layer < 2; layer++) {
                        const idx = w * 36 + s * 2 + layer;
                        if (idx >= TOTAL || !tilePositions[idx]) continue;
                        const tp = tilePositions[idx];
                        const shift = s <= bStack ? -8 : 8;
                        tiles[idx].classList.add('break-gap');
                        tiles[idx].style.transform = `translate(${tp.x + shift * wall.dx}px,${tp.y + shift * wall.dy}px) rotate(${tp.angle}deg)`;
                    }
                }
            }
        }, 5800);

        // ── Phase 7: Deal tiles from walls to players (6500ms) ──
        // Use batched RAF approach instead of 104 individual setTimeouts
        animTimer(() => {
            windLabels.forEach(l => { l.style.opacity = '0'; });

            const targets = [
                { x: cx, y: H - 50 },
                { x: W - 60, y: cy },
                { x: cx, y: 50 },
                { x: 60, y: cy }
            ];

            // Pre-compute all deal moves, then apply in batched RAF frames
            const dealMoves = [];
            for (let w = 0; w < 4; w++) {
                const target = targets[w];
                for (let i = 0; i < 26; i++) {
                    const idx = w * 36 + i;
                    if (idx >= TOTAL) break;
                    dealMoves.push({ idx, target, batch: Math.floor(i / 4) });
                }
            }

            // Group by batch and apply each batch with a single timer
            const batches = {};
            for (const m of dealMoves) {
                if (!batches[m.batch]) batches[m.batch] = [];
                batches[m.batch].push(m);
            }
            for (const [batchNum, moves] of Object.entries(batches)) {
                animTimer(() => {
                    for (const m of moves) {
                        tiles[m.idx].style.transition = 'transform 0.4s cubic-bezier(0.55,0.06,0.68,0.19), opacity 0.25s ease 0.1s';
                        tiles[m.idx].style.transform = `translate(${m.target.x - TW / 2}px,${m.target.y - TH / 2}px) scale(0.5)`;
                        tiles[m.idx].style.opacity = '0';
                    }
                }, batchNum * 100);
            }
        }, 6500);

        // ── Phase 8: Fade out overlay, reveal game board (8200ms) ──
        animTimer(() => {
            overlay.style.transition = 'opacity 0.4s ease';
            overlay.style.opacity = '0';
            animTimer(() => {
                overlay.remove();
                _animTimers = [];
                if (callback) callback();
            }, 400);
        }, 8200);
    }

    // ========== PERFORMANCE: RAF batching & caches ==========
    let _pendingState = null;
    let _rafId = null;
    let _lastWallCount = -1;
    let _lastLogLength = 0;
    const isMobile = window.matchMedia('(max-width: 700px)').matches;

    function scheduleBoardUpdate(state) {
        _pendingState = state;
        if (!_rafId) {
            _rafId = requestAnimationFrame(() => {
                _rafId = null;
                if (_pendingState) {
                    updateBoard(_pendingState);
                    _pendingState = null;
                }
            });
        }
    }

    const socket = io();

    // Reconnect to room
    socket.on('connect', () => {
        socket.emit('setName', myName);
        if (isSpectator) {
            socket.emit('spectateRoom', { name: myName, code: roomCode });
        } else {
            socket.emit('joinRoom', { name: myName, code: roomCode });
        }
    });

    // ========== TILE WALL RENDERING ==========
    function renderWall(wallRemaining, deadWallRemaining) {
        const total = (wallRemaining || 0) + (deadWallRemaining || 0);

        // Skip re-render if wall count unchanged
        if (total === _lastWallCount) return;
        _lastWallCount = total;

        const tilesPerSide = Math.ceil(total / 8);
        const sides = ['wallBottom', 'wallRight', 'wallTop', 'wallLeft'];
        let remaining = total;

        for (let s = 0; s < 4; s++) {
            const sideEl = document.getElementById(sides[s]);
            sideEl.innerHTML = '';
            const count = Math.min(tilesPerSide, Math.ceil(remaining / 2));
            // On mobile, use a DocumentFragment to batch DOM inserts
            const frag = document.createDocumentFragment();
            for (let i = 0; i < count && remaining > 0; i++) {
                const brick = document.createElement('div');
                brick.className = remaining >= 2 ? 'wall-brick stacked' : 'wall-brick';
                remaining -= remaining >= 2 ? 2 : 1;
                frag.appendChild(brick);
            }
            sideEl.appendChild(frag);
        }

        document.getElementById('wallDisplay').style.display = total > 0 ? 'block' : 'none';
    }

    // Tile rendering with English translations
    function renderTile(tile, extraClass = '') {
        const div = document.createElement('div');
        div.className = `tile ${tile.suit} ${extraClass}`;
        if (tile.suit === 'dragons') div.classList.add(tile.value);
        div.dataset.tileId = tile.id;

        const valDiv = document.createElement('div');
        valDiv.className = 'tile-value';
        const engDiv = document.createElement('div');
        engDiv.className = 'tile-eng';

        if (tile.suit === 'dots') {
            const dotsDiv = document.createElement('div');
            dotsDiv.className = 'dots-display';
            const count = typeof tile.value === 'number' ? tile.value : 1;
            for (let i = 0; i < count; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot-circle';
                dotsDiv.appendChild(dot);
            }
            div.appendChild(dotsDiv);
            engDiv.textContent = tile.value + ' Dot';
            div.appendChild(engDiv);
        } else if (tile.suit === 'bamboo') {
            if (tile.value === 1) {
                valDiv.textContent = '🐦';
                valDiv.style.fontSize = '22px';
                div.appendChild(valDiv);
            } else {
                const bamDiv = document.createElement('div');
                bamDiv.className = 'bamboo-display';
                for (let i = 0; i < tile.value; i++) {
                    const stick = document.createElement('div');
                    stick.className = 'bamboo-stick';
                    bamDiv.appendChild(stick);
                }
                div.appendChild(bamDiv);
            }
            engDiv.textContent = tile.value + ' Bam';
            div.appendChild(engDiv);
        } else if (tile.suit === 'characters') {
            const chars = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
            valDiv.textContent = chars[tile.value] || tile.value;
            div.appendChild(valDiv);
            engDiv.textContent = tile.value + ' Wan';
            engDiv.style.color = '#C62828';
            div.appendChild(engDiv);
        } else if (tile.suit === 'winds') {
            valDiv.textContent = WIND_CHARS[tile.value] || tile.value;
            div.appendChild(valDiv);
            engDiv.textContent = WIND_ENG_FULL[tile.value] || tile.value;
            div.appendChild(engDiv);
        } else if (tile.suit === 'dragons') {
            valDiv.textContent = DRAGON_CHARS[tile.value] || tile.value;
            div.appendChild(valDiv);
            engDiv.textContent = DRAGON_ENG[tile.value] || tile.value;
            div.appendChild(engDiv);
        } else if (tile.suit === 'flowers') {
            valDiv.textContent = FLOWER_CHARS[tile.value] || tile.value;
            valDiv.style.color = '#E91E63';
            div.appendChild(valDiv);
            engDiv.textContent = FLOWER_ENG[tile.value] || tile.value;
            div.appendChild(engDiv);
        } else if (tile.suit === 'seasons') {
            valDiv.textContent = SEASON_CHARS[tile.value] || tile.value;
            valDiv.style.color = '#FF9800';
            div.appendChild(valDiv);
            engDiv.textContent = SEASON_ENG[tile.value] || tile.value;
            div.appendChild(engDiv);
        }

        return div;
    }

    function renderTileBack(small = false) {
        const div = document.createElement('div');
        div.className = 'tile-back' + (small ? ' tile-back-small' : '');
        return div;
    }

    function renderFlowerTile(tile) {
        const div = document.createElement('div');
        div.className = 'flower-tile';
        div.title = tile.suit === 'flowers' ? (FLOWER_ENG[tile.value] || 'Flower') : (SEASON_ENG[tile.value] || 'Season');
        if (tile.suit === 'flowers') div.textContent = FLOWER_CHARS[tile.value] || '花';
        else div.textContent = SEASON_CHARS[tile.value] || '季';
        return div;
    }

    // Seat positions: Bottom=me, Right=next, Top=across, Left=previous
    function getRelativeSeat(absoluteSeat) {
        if (isSpectator) return absoluteSeat;
        return (absoluteSeat - mySeat + 4) % 4;
    }
    function getAbsoluteSeat(relativeSeat) {
        if (isSpectator) return relativeSeat;
        return (relativeSeat + mySeat) % 4;
    }

    function updateBoard(state) {
        gameState = state;

        // Wall count and wall display
        document.getElementById('wallCount').textContent = `Wall: ${state.wallRemaining || '--'}`;
        renderWall(state.wallRemaining, state.deadWallRemaining);

        // Turn indicator
        const turnEl = document.getElementById('turnIndicator');
        if (state.phase === 'playing' || state.phase === 'claim') {
            const cp = state.players[state.currentPlayer];
            turnEl.textContent = `${cp.name}'s Turn`;
        } else {
            turnEl.textContent = '';
        }

        // Update each player position
        for (let relSeat = 0; relSeat < 4; relSeat++) {
            const absSeat = getAbsoluteSeat(relSeat);
            const player = state.players[absSeat];
            const posId = ['Bottom', 'Right', 'Top', 'Left'][relSeat];

            const windEl = document.getElementById('wind' + posId);
            const nameEl = document.getElementById('name' + posId);
            const scoreEl = document.getElementById('score' + posId);
            const infoEl = document.getElementById('info' + posId);

            if (windEl) windEl.textContent = (WIND_ENG[player.seatWind] || '') + ' ' + (WIND_CHARS[player.seatWind] || '');
            if (nameEl) {
                nameEl.textContent = player.name;
            }
            if (scoreEl) scoreEl.textContent = player.score;
            if (infoEl) {
                infoEl.classList.toggle('active', state.currentPlayer === absSeat);
            }

            const countEl = document.getElementById('count' + posId);
            if (countEl && relSeat !== 0) {
                countEl.textContent = `(${player.handSize})`;
            }

            // Flowers
            const flowersEl = document.getElementById('flowers' + posId);
            if (flowersEl) {
                const flowerCount = (player.flowers || []).length;
                if (flowersEl.children.length !== flowerCount) {
                    flowersEl.innerHTML = '';
                    const frag = document.createDocumentFragment();
                    for (const f of player.flowers || []) {
                        frag.appendChild(renderFlowerTile(f));
                    }
                    flowersEl.appendChild(frag);
                }
            }

            // Melds
            const meldsEl = document.getElementById('melds' + posId);
            if (meldsEl) {
                const meldCount = (player.melds || []).length;
                if (meldsEl.children.length !== meldCount) {
                    meldsEl.innerHTML = '';
                    const frag = document.createDocumentFragment();
                    for (const meld of player.melds || []) {
                        const group = document.createElement('div');
                        group.className = 'meld-group';
                        for (const t of meld.tiles) {
                            group.appendChild(renderTile(t, 'tile-small'));
                        }
                        frag.appendChild(group);
                    }
                    meldsEl.appendChild(frag);
                }
            }

            // Other players' hands (face down)
            if (relSeat !== 0) {
                const handEl = document.getElementById('hand' + posId);
                if (handEl) {
                    const sz = player.handSize || 0;
                    if (handEl.children.length !== sz) {
                        handEl.innerHTML = '';
                        const frag = document.createDocumentFragment();
                        for (let i = 0; i < sz; i++) {
                            frag.appendChild(renderTileBack(true));
                        }
                        handEl.appendChild(frag);
                    }
                }
            }
        }

        // My hand (face up)
        if (!isSpectator && state.yourHand) {
            renderMyHand(state.yourHand);
        } else if (isSpectator) {
            const myHandEl = document.getElementById('myHand');
            myHandEl.innerHTML = '<span style="color:var(--gold-dim);font-size:12px;letter-spacing:2px;">SPECTATING</span>';
        }

        // Discard pool - full rebuild each update
        // (incremental by count breaks because allDiscards is grouped per-player, not chronological)
        const poolEl = document.getElementById('discardPool');
        const allDiscards = [];
        for (let i = 0; i < 4; i++) {
            for (const d of (state.players[i].discards || [])) {
                allDiscards.push({ tile: d, playerIndex: i });
            }
        }
        allDiscards.sort((a, b) => (a.tile.discardOrder ?? 0) - (b.tile.discardOrder ?? 0));

        poolEl.innerHTML = '';
        const frag = document.createDocumentFragment();
        for (const d of allDiscards) {
            const tEl = renderTile(d.tile, 'tile-small');
            if (state.lastDiscard && d.tile.id === state.lastDiscard.id) {
                tEl.classList.add('last-discard');
            }
            frag.appendChild(tEl);
        }
        poolEl.appendChild(frag);

        updatePlayerList(state);
        updateGameLog(state.gameLog || []);
    }

    // Event delegation for hand tiles (set up once)
    const _myHandEl = document.getElementById('myHand');
    _myHandEl.addEventListener('click', (e) => {
        if (!canAct) return;
        const tileEl = e.target.closest('.tile');
        if (!tileEl || !tileEl.dataset.tileId) return;
        const tileId = parseInt(tileEl.dataset.tileId);

        if (selectedTile === tileId) {
            discardTile(tileId);
            return;
        }
        // Deselect previous
        const prev = _myHandEl.querySelector('.tile.selected');
        if (prev) prev.classList.remove('selected');
        selectedTile = tileId;
        tileEl.classList.add('selected');
    });
    _myHandEl.addEventListener('dblclick', (e) => {
        if (!canAct) return;
        const tileEl = e.target.closest('.tile');
        if (!tileEl || !tileEl.dataset.tileId) return;
        discardTile(parseInt(tileEl.dataset.tileId));
    });

    function renderMyHand(hand) {
        _myHandEl.innerHTML = '';
        selectedTile = null;

        const frag = document.createDocumentFragment();
        let drawnTileEl = null;

        for (let i = 0; i < hand.length; i++) {
            const tile = hand[i];
            const tileEl = renderTile(tile);
            tileEl.dataset.tileId = tile.id;

            if (drawnTileId !== null && tile.id === drawnTileId) {
                tileEl.classList.add('drawn-tile');
                drawnTileEl = tileEl;
            } else {
                frag.appendChild(tileEl);
            }
        }
        // Place drawn tile at the left, separated from the rest
        if (drawnTileEl) {
            _myHandEl.appendChild(drawnTileEl);
        }
        _myHandEl.appendChild(frag);
    }

    function updatePlayerList(state) {
        const listEl = document.getElementById('playerList');
        listEl.innerHTML = '';
        for (let i = 0; i < 4; i++) {
            const p = state.players[i];
            const item = document.createElement('div');
            item.className = 'player-list-item' + (state.currentPlayer === i ? ' current-turn' : '');
            item.innerHTML = `
                <span class="wind">${WIND_ENG[p.seatWind] || ''} ${WIND_CHARS[p.seatWind] || ''}</span>
                <span class="name ${p.isAI ? 'is-ai' : ''}">${p.name}</span>
                <span class="score-val">${p.score >= 0 ? '+' : ''}${p.score}</span>
            `;
            listEl.appendChild(item);
        }
    }

    function updateGameLog(log) {
        const logEl = document.getElementById('gameLog');

        // If log shrunk (new round), full rebuild
        if (log.length < _lastLogLength) {
            logEl.innerHTML = '';
            _lastLogLength = 0;
        }

        // Only append new entries
        if (log.length > _lastLogLength) {
            const frag = document.createDocumentFragment();
            for (let i = _lastLogLength; i < log.length; i++) {
                const entry = log[i];
                const div = document.createElement('div');
                div.className = 'log-entry';
                if (entry.message.includes('wins') || entry.message.includes('started') || entry.message.includes('Gong') || entry.message.includes('Pung') || entry.message.includes('Soeng')) {
                    div.classList.add('important');
                }
                div.textContent = entry.message;
                frag.appendChild(div);
            }
            logEl.appendChild(frag);
            _lastLogLength = log.length;

            // Cap at 100 entries to prevent unbounded DOM growth
            while (logEl.children.length > 100) {
                logEl.removeChild(logEl.firstChild);
            }
            logEl.scrollTop = logEl.scrollHeight;
        }
    }

    // ========== WIN CELEBRATION ==========
    const TILE_EMOJIS = [
        '\u{1F000}','\u{1F001}','\u{1F002}','\u{1F003}','\u{1F004}','\u{1F005}','\u{1F006}',
        '\u{1F007}','\u{1F008}','\u{1F009}','\u{1F00A}','\u{1F00B}','\u{1F00C}','\u{1F00D}',
        '\u{1F00E}','\u{1F00F}','\u{1F010}','\u{1F011}','\u{1F012}','\u{1F013}','\u{1F014}',
        '\u{1F015}','\u{1F016}','\u{1F017}','\u{1F018}','\u{1F019}','\u{1F01A}','\u{1F01B}'
    ];
    const CONFETTI_COLORS = ['#C9A96E','#E8D5A3','#C44536','#1B6B3A','#6B2D3E','#FFD700','#FF6B6B','#4ECDC4','#F5F0E1','#FF9F43'];

    function launchConfetti(container) {
        const count = 80;
        for (let i = 0; i < count; i++) {
            const el = document.createElement('div');
            const shape = ['square','circle','strip'][Math.floor(Math.random()*3)];
            el.className = `confetti ${shape}`;
            el.style.left = Math.random() * 100 + '%';
            el.style.background = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
            el.style.animationDuration = (2 + Math.random() * 3) + 's';
            el.style.animationDelay = (Math.random() * 1.5) + 's';
            if (shape === 'strip') {
                el.style.width = (4 + Math.random()*4) + 'px';
                el.style.height = (12 + Math.random()*10) + 'px';
            } else {
                const size = 6 + Math.random() * 10;
                el.style.width = size + 'px';
                el.style.height = size + 'px';
            }
            container.appendChild(el);
            el.addEventListener('animationend', () => el.remove());
        }
    }

    function launchTileBurst(container) {
        const cx = container.offsetWidth / 2;
        const cy = container.offsetHeight / 2;
        const count = 18;
        for (let i = 0; i < count; i++) {
            const el = document.createElement('div');
            el.className = 'burst-tile';
            el.textContent = TILE_EMOJIS[Math.floor(Math.random()*TILE_EMOJIS.length)];
            el.style.left = cx + 'px';
            el.style.top = cy + 'px';
            const angle = (Math.PI * 2 * i) / count + (Math.random()-0.5)*0.4;
            const dist = 120 + Math.random() * 200;
            const tx = Math.cos(angle) * dist;
            const ty = Math.sin(angle) * dist;
            const rot = (Math.random()-0.5) * 720;
            const scale = 0.5 + Math.random() * 0.8;
            const dur = 1.2 + Math.random() * 0.8;
            el.style.animation = 'none';
            el.style.animationDuration = dur + 's';
            // Use custom keyframes via inline style for unique trajectories
            el.animate([
                { transform: 'translate(-50%,-50%) rotate(0deg) scale(1)', opacity: 1 },
                { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) rotate(${rot}deg) scale(${scale})`, opacity: 0 }
            ], { duration: dur * 1000, easing: 'ease-out', fill: 'forwards' });
            container.appendChild(el);
            setTimeout(() => el.remove(), dur * 1000 + 100);
        }
    }

    function celebrateWin(container) {
        launchConfetti(container);
        launchTileBurst(container);
        // Second wave of confetti after a beat
        setTimeout(() => launchConfetti(container), 1200);
    }

    function showActions(actions) {
        const bar = document.getElementById('actionBar');
        bar.innerHTML = '';
        bar.classList.add('visible');
        for (const action of actions) {
            const btn = document.createElement('button');
            btn.className = `action-btn ${action.type}`;
            btn.textContent = action.label;
            btn.addEventListener('click', action.handler);
            bar.appendChild(btn);
        }
    }

    function hideActions() {
        const bar = document.getElementById('actionBar');
        bar.innerHTML = '';
        bar.classList.remove('visible');
    }

    function discardTile(tileId) {
        if (!canAct || claimMode) return;
        canAct = false;
        drawnTileId = null;
        hideActions();
        socket.emit('discardTile', { tileId });
    }

    function startGame() {
        socket.emit('startGame');
    }

    function nextRound() {
        const winOverlay = document.getElementById('winOverlay');
        winOverlay.classList.remove('show');
        // Clean up celebration particles
        winOverlay.querySelectorAll('.confetti, .burst-tile').forEach(el => el.remove());
        document.getElementById('drawOverlay').classList.remove('show');
        socket.emit('nextRound');
    }

    function sendChat() {
        const input = document.getElementById('chatInput');
        const msg = input.value.trim();
        if (msg) {
            socket.emit('chatMessage', { message: msg });
            input.value = '';
        }
    }

    document.getElementById('chatInput').addEventListener('keyup', (e) => {
        if (e.key === 'Enter') sendChat();
    });

    // Socket event handlers
    socket.on('gameState', (state) => {
        scheduleBoardUpdate(state);
        if (state.phase === 'waiting' || (state.phase === 'finished' && !document.getElementById('winOverlay').classList.contains('show'))) {
            document.getElementById('waitingOverlay').classList.remove('hidden');
        } else {
            document.getElementById('waitingOverlay').classList.add('hidden');
        }
    });

    socket.on('gameStarted', () => {
        // Reset incremental caches for new round
        _lastWallCount = -1;
        _lastLogLength = 0;
        document.getElementById('waitingOverlay').classList.add('hidden');
        document.getElementById('winOverlay').classList.remove('show');
        document.getElementById('drawOverlay').classList.remove('show');

        // Play the shuffle → wall → deal animation, then show teach message
        playDealAnimation(() => {
            showTeachMessage('Game Started!', 'Tiles have been dealt! You have 13 tiles (14 if you\'re the dealer). <b>Suits:</b> Dots (circles), Bamboo (sticks), Characters (numbers with 萬). <b>Honors:</b> Winds (E/S/W/N) and Dragons (Red/Green/White). Build 4 sets + 1 pair to win! The tile wall around the center shows how many tiles remain.', 15000);
        });
    });

    socket.on('roomUpdate', (info) => {
        // Cache room info for deal animation
        _lastRoomInfo = info;
        // Update table name and AI delay if available
        if (info.tableName) {
            document.getElementById('tableNameDisplay').textContent = info.tableName;
        }
        if (info.aiDelay) {
            const seconds = Math.round(info.aiDelay / 1000);
            aiSpeedSlider.value = seconds;
            aiSpeedLabel.textContent = seconds + 's';
        }
        // Update player list in sidebar (especially before game starts)
        if (info.players) {
            const listEl = document.getElementById('playerList');
            listEl.innerHTML = '';
            for (const p of info.players) {
                const item = document.createElement('div');
                item.className = 'player-list-item';
                item.innerHTML = `
                    <span class="wind">${WIND_ENG[p.seatWind] || ''} ${WIND_CHARS[p.seatWind] || ''}</span>
                    <span class="name ${p.isAI ? 'is-ai' : ''}">${p.name}</span>
                `;
                listEl.appendChild(item);
            }
        }
    });

    socket.on('playerJoined', (data) => {
        showJoinToast(data.name + ' has joined your table');
    });

    function showJoinToast(message) {
        const toast = document.createElement('div');
        toast.className = 'join-toast';
        toast.textContent = message;
        document.body.appendChild(toast);
        // Trigger reflow then animate in
        requestAnimationFrame(() => {
            toast.classList.add('show');
        });
        setTimeout(() => {
            toast.classList.remove('show');
            toast.addEventListener('transitionend', () => toast.remove());
        }, 3000);
    }

    socket.on('yourTurn', (data) => {
        canAct = true;
        claimMode = false;
        drawnTileId = data.drawnTile ? data.drawnTile.id : null;

        const actions = [];

        if (data.canWin) {
            actions.push({
                type: 'win',
                label: 'Mahjong!',
                handler: () => {
                    socket.emit('declareWin');
                    canAct = false;
                    hideActions();
                }
            });
        }

        if (data.canKong && data.canKong.length > 0) {
            for (const kong of data.canKong) {
                actions.push({
                    type: 'gong',
                    label: 'Gong',
                    handler: () => {
                        socket.emit('declareKong', kong);
                        canAct = false;
                        hideActions();
                    }
                });
            }
        }

        actions.push({
            type: 'pass',
            label: 'Discard a Tile',
            handler: () => { hideActions(); }
        });

        if (actions.length > 1) {
            showActions(actions);
        } else {
            hideActions();
        }

        if (data.canWin) {
            showTeachMessage('You Can Win!', 'Your hand is complete! Click the <b>Mahjong!</b> button to declare your win. This is a self-drawn win (zi mo / 自摸) which earns you bonus points because you completed the hand yourself.');
        } else if (data.canKong && data.canKong.length > 0) {
            showTeachMessage('Gong Available', 'You have 4 identical tiles &mdash; you can declare a <b>Gong</b> to score a bonus and draw a replacement tile. Or just discard a tile by clicking on it twice.');
        } else {
            showTeachMessage('Your Turn', 'You drew a tile (shown with a gap on the right). Look at your hand and decide which tile to discard. <b>Double-click</b> a tile to discard it, or click once to select then press Space/Enter. Try to keep tiles that form pairs, runs (e.g. 3-4-5), or triplets (e.g. three 7s).');
        }

        if (gameState && gameState.yourHand) {
            renderMyHand(gameState.yourHand);
        }
    });

    socket.on('yourTurnDiscard', (data) => {
        canAct = true;
        claimMode = false;
        drawnTileId = null;
        hideActions();
        if (data && data.isDealer) {
            showTeachMessage('Dealer\'s First Turn', 'You are the dealer (East wind) so you start with 14 tiles. Everyone else has 13. Discard one tile to begin the game. <b>Double-click</b> a tile to discard it.');
        } else {
            showTeachMessage('Discard a Tile', 'You just claimed a tile and now need to discard one. Choose a tile that doesn\'t fit your hand &mdash; isolated tiles with no matching pairs or sequence neighbors are good candidates.');
        }
    });

    socket.on('claimAvailable', (data) => {
        claimMode = true;
        const actions = [];

        for (const claim of data.claims) {
            if (claim.type === 'win') {
                actions.push({
                    type: 'win',
                    label: 'Mahjong!',
                    handler: () => {
                        socket.emit('claimAction', { type: 'win' });
                        canAct = false;
                        hideActions();
                    }
                });
            }
            if (claim.type === 'kong') {
                actions.push({
                    type: 'gong',
                    label: 'Gong',
                    handler: () => {
                        socket.emit('claimAction', { type: 'kong' });
                        canAct = false;
                        hideActions();
                    }
                });
            }
            if (claim.type === 'pong') {
                actions.push({
                    type: 'pung',
                    label: 'Pung',
                    handler: () => {
                        socket.emit('claimAction', { type: 'pong' });
                        canAct = false;
                        hideActions();
                    }
                });
            }
            if (claim.type === 'chow') {
                const chowTiles = claim.options && claim.options[0] ? claim.options[0] : [];
                actions.push({
                    type: 'soeng',
                    label: 'Soeng',
                    handler: () => {
                        socket.emit('claimAction', { type: 'chow', tiles: chowTiles });
                        canAct = false;
                        hideActions();
                    }
                });
            }
        }

        actions.push({
            type: 'pass',
            label: 'Pass',
            handler: () => {
                socket.emit('claimAction', { type: 'pass' });
                canAct = false;
                hideActions();
            }
        });

        canAct = true;
        showActions(actions);

        const claimTypes = data.claims.map(c => c.type);
        let teachMsg = 'Another player discarded a tile you can use! Your options:<br>';
        if (claimTypes.includes('win')) teachMsg += '&bull; <b>Mahjong!</b> &mdash; Claim the tile to complete your winning hand<br>';
        if (claimTypes.includes('kong')) teachMsg += '&bull; <b>Gong</b> &mdash; You have 3 matching tiles; add the discard to make a set of 4<br>';
        if (claimTypes.includes('pong')) teachMsg += '&bull; <b>Pung</b> &mdash; You have 2 matching tiles; claim the discard to make a triplet<br>';
        if (claimTypes.includes('chow')) teachMsg += '&bull; <b>Soeng</b> &mdash; The discard completes a run in your hand (e.g. 3-4-5 of the same suit). Only available from the player before you.<br>';
        teachMsg += '&bull; <b>Pass</b> &mdash; Skip and let the game continue<br>';
        teachMsg += '<i>Note: Claiming exposes those tiles face-up, giving opponents info about your hand.</i>';
        showTeachMessage('You Can Claim!', teachMsg, 15000);
    });

    socket.on('tileDiscarded', (data) => {
        if (data.playerIndex !== mySeat) {
            showTeachMessage('Tile Discarded', `<b>${data.playerName}</b> discarded a tile. It goes to the discard pool in the center. If you can\'t use it, the next player will draw from the wall.`);
        }
    });

    socket.on('meldMade', (data) => {
        const typeNames = { pong: 'Pung (triplet of 3 identical tiles)', kong: 'Gong (set of 4 identical tiles)', chow: 'Soeng (run of 3 consecutive tiles in a suit)' };
        showTeachMessage('Meld Declared', `<b>${data.playerName}</b> declared a <b>${typeNames[data.meldType] || data.meldType}</b>. These tiles are now exposed face-up on the table. That player must now discard a tile.`);
    });

    socket.on('gameWon', (data) => {
        claimMode = false;
        const overlay = document.getElementById('winOverlay');
        overlay.classList.add('show');

        const winTitle = document.getElementById('winTitle');
        if (data.selfDrawn) {
            winTitle.innerHTML = 'Self-Drawn!<span class="sik-wu">Sik Wu!</span>';
        } else {
            winTitle.innerHTML = 'Mahjong!<span class="sik-wu">Sik Wu!</span>';
        }
        document.getElementById('winnerName').textContent = `${data.winnerName} wins!`;

        // Launch celebration
        celebrateWin(overlay);

        const faanList = document.getElementById('faanList');
        faanList.innerHTML = '';
        if (data.faan && data.faan.details) {
            for (const detail of data.faan.details) {
                const item = document.createElement('div');
                item.className = 'faan-item';
                item.textContent = detail;
                faanList.appendChild(item);
            }
        }

        const faanTotal = document.getElementById('faanTotal');
        faanTotal.textContent = `Total: ${data.faan ? data.faan.faan : 0} Faan`;

        if (data.scores) {
            const scoresDiv = document.createElement('div');
            scoresDiv.style.marginTop = '15px';
            for (let i = 0; i < 4; i++) {
                if (gameState && gameState.players[i]) {
                    const s = document.createElement('div');
                    s.className = 'faan-item';
                    s.textContent = `${gameState.players[i].name}: ${data.scores[i] >= 0 ? '+' : ''}${data.scores[i]}`;
                    scoresDiv.appendChild(s);
                }
            }
            faanList.appendChild(scoresDiv);
        }

        canAct = false;
        hideActions();

        showTeachMessage('Round Over!', `<b>${data.winnerName}</b> completed a winning hand! ` +
            (data.selfDrawn ? 'They won by <b>self-draw</b> (drawing the winning tile themselves). In self-draw wins, all 3 losers pay equally.' :
            'They won from a <b>discard</b>. The player who discarded the winning tile pays the full amount.') +
            ` The hand scored <b>${data.faan ? data.faan.faan : 0} faan</b>. Higher faan means more points! Click "Next Round" to continue.`, 20000);
    });

    socket.on('gameDraw', () => {
        claimMode = false;
        document.getElementById('drawOverlay').classList.add('show');
        canAct = false;
        hideActions();
        showTeachMessage('Draw Game', 'The wall ran out of tiles and nobody completed a winning hand. This happens sometimes! No points change hands. Click "Next Round" to play again.', 15000);
    });

    socket.on('chatMessage', (data) => {
        const msgs = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = 'chat-msg';
        div.innerHTML = `<span class="chat-name">${data.name}${data.isSpectator ? ' [S]' : ''}:</span> ${escapeHtml(data.message)}`;
        msgs.appendChild(div);
        // Cap at 1000 messages to prevent DOM bloat
        while (msgs.children.length > 1000) {
            msgs.removeChild(msgs.firstChild);
        }
        msgs.scrollTop = msgs.scrollHeight;
    });

    socket.on('error', (data) => {
        console.warn('Server error:', data.message);
        // Re-enable player input so they aren't permanently stuck
        // (e.g. if a discard was rejected due to wrong phase/turn).
        // The server will reject any truly invalid follow-up action anyway.
        canAct = true;
    });

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;

        if ((e.key === ' ' || e.key === 'Enter') && selectedTile !== null && canAct) {
            e.preventDefault();
            discardTile(selectedTile);
        }

        if (e.key === 'Escape') {
            selectedTile = null;
            const sel = _myHandEl.querySelector('.tile.selected');
            if (sel) sel.classList.remove('selected');
        }
    });
    </script>
</body>
</html>
