<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D5A3"/>
      <stop offset="50%" style="stop-color:#C9A96E"/>
      <stop offset="100%" style="stop-color:#8B7340"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A96E"/>
      <stop offset="100%" style="stop-color:#8B7340"/>
    </linearGradient>
  </defs>
  <!-- Circular border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.5"/>
  <!-- Sparrow body -->
  <g transform="translate(100,95)">
    <!-- Body -->
    <ellipse cx="0" cy="10" rx="32" ry="22" fill="url(#bodyGrad)" opacity="0.9"/>
    <!-- Head -->
    <circle cx="-18" cy="-12" r="16" fill="url(#goldGrad)" opacity="0.9"/>
    <!-- Eye -->
    <circle cx="-22" cy="-15" r="3" fill="#0A0F0D"/>
    <circle cx="-23" cy="-16" r="1" fill="#F4ECD8"/>
    <!-- Beak -->
    <polygon points="-34,-12 -42,-10 -34,-8" fill="#8B7340"/>
    <!-- Wing -->
    <path d="M -5,0 Q 20,-15 35,-5 Q 25,5 10,10 Z" fill="#8B7340" opacity="0.8"/>
    <path d="M 0,3 Q 18,-10 30,-2 Q 22,6 8,10 Z" fill="url(#goldGrad)" opacity="0.4"/>
    <!-- Tail -->
    <path d="M 25,5 Q 45,-10 50,-15 Q 42,0 30,12 Z" fill="#8B7340" opacity="0.7"/>
    <path d="M 28,8 Q 48,-5 52,-12 Q 45,3 32,14 Z" fill="url(#goldGrad)" opacity="0.3"/>
    <!-- Feet -->
    <line x1="-8" y1="28" x2="-12" y2="38" stroke="#8B7340" stroke-width="1.5"/>
    <line x1="5" y1="28" x2="2" y2="38" stroke="#8B7340" stroke-width="1.5"/>
    <line x1="-15" y1="38" x2="-8" y2="38" stroke="#8B7340" stroke-width="1"/>
    <line x1="-1" y1="38" x2="6" y2="38" stroke="#8B7340" stroke-width="1"/>
  </g>
  <!-- Mahjong tile accent -->
  <g transform="translate(140,140)">
    <rect x="0" y="0" width="20" height="26" rx="2" fill="#F5F0E1" stroke="#C4BCA8" stroke-width="0.8"/>
    <text x="10" y="18" font-family="serif" font-size="14" fill="#C62828" text-anchor="middle">中</text>
  </g>
  <!-- Text arc - SPARROW -->
  <path id="topArc" d="M 35,100 A 65,65 0 0,1 165,100" fill="none"/>
  <text font-family="Georgia, serif" font-size="14" fill="#C9A96E" letter-spacing="6">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">SPARROW</textPath>
  </text>
  <!-- Text arc - SOCIAL CLUB -->
  <path id="bottomArc" d="M 35,105 A 65,65 0 0,0 165,105" fill="none"/>
  <text font-family="Georgia, serif" font-size="10" fill="#8B7340" letter-spacing="4">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">SOCIAL CLUB</textPath>
  </text>
</svg>
