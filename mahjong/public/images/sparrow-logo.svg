<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D5A3"/>
      <stop offset="50%" style="stop-color:#C9A96E"/>
      <stop offset="100%" style="stop-color:#A8893A"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2A1A"/>
      <stop offset="100%" style="stop-color:#0D1A0D"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0E1"/>
      <stop offset="100%" style="stop-color:#E8E0CC"/>
    </linearGradient>
    <linearGradient id="flowerPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F4B8C1"/>
      <stop offset="100%" style="stop-color:#E8909E"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="150" cy="150" r="138"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="150" cy="150" r="142" fill="url(#goldGrad)"/>
  <circle cx="150" cy="150" r="138" fill="url(#darkBg)"/>

  <!-- Inner decorative ring -->
  <circle cx="150" cy="150" r="128" fill="none" stroke="#C9A96E" stroke-width="0.8" opacity="0.6"/>
  <circle cx="150" cy="150" r="125" fill="none" stroke="#C9A96E" stroke-width="0.3" opacity="0.4"/>

  <!-- Art deco decorative elements at cardinal points -->
  <!-- Top deco -->
  <g transform="translate(150,22)">
    <polygon points="0,-6 5,0 0,6 -5,0" fill="#C9A96E" opacity="0.8"/>
    <line x1="-14" y1="0" x2="-7" y2="0" stroke="#C9A96E" stroke-width="1" opacity="0.6"/>
    <line x1="7" y1="0" x2="14" y2="0" stroke="#C9A96E" stroke-width="1" opacity="0.6"/>
  </g>
  <!-- Bottom deco -->
  <g transform="translate(150,278)">
    <polygon points="0,-6 5,0 0,6 -5,0" fill="#C9A96E" opacity="0.8"/>
    <line x1="-14" y1="0" x2="-7" y2="0" stroke="#C9A96E" stroke-width="1" opacity="0.6"/>
    <line x1="7" y1="0" x2="14" y2="0" stroke="#C9A96E" stroke-width="1" opacity="0.6"/>
  </g>
  <!-- Left deco -->
  <g transform="translate(22,150)">
    <polygon points="0,-5 6,0 0,5 -6,0" fill="#C9A96E" opacity="0.8"/>
  </g>
  <!-- Right deco -->
  <g transform="translate(278,150)">
    <polygon points="0,-5 6,0 0,5 -6,0" fill="#C9A96E" opacity="0.8"/>
  </g>

  <!-- Small stars scattered -->
  <g fill="#C9A96E" opacity="0.7">
    <circle cx="80" cy="60" r="1.5"/>
    <circle cx="220" cy="60" r="1.5"/>
    <circle cx="65" cy="100" r="1"/>
    <circle cx="235" cy="100" r="1"/>
    <circle cx="90" cy="230" r="1.2"/>
    <circle cx="210" cy="230" r="1.2"/>
    <circle cx="70" cy="180" r="1"/>
    <circle cx="230" cy="180" r="1"/>
    <!-- 4-point star shapes -->
    <polygon points="105,52 106.5,55 110,56 106.5,57 105,60 103.5,57 100,56 103.5,55" opacity="0.6"/>
    <polygon points="195,52 196.5,55 200,56 196.5,57 195,60 193.5,57 190,56 193.5,55" opacity="0.6"/>
    <polygon points="60,140 61.5,143 65,144 61.5,145 60,148 58.5,145 55,144 58.5,143" opacity="0.5"/>
    <polygon points="240,140 241.5,143 245,144 241.5,145 240,148 238.5,145 235,144 238.5,143" opacity="0.5"/>
  </g>

  <!-- Text arc - SPARROW at top -->
  <path id="topArc" d="M 50,150 A 100,100 0 0,1 250,150" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#C9A96E" letter-spacing="8" font-weight="bold">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">SPARROW</textPath>
  </text>

  <!-- Text arc - SOCIAL CLUB at bottom -->
  <path id="bottomArc" d="M 55,160 A 95,95 0 0,0 245,160" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#A8893A" letter-spacing="6">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">SOCIAL CLUB</textPath>
  </text>

  <!-- Left mahjong tile - 東 (East) -->
  <g transform="translate(62,120)">
    <rect x="0" y="0" width="32" height="42" rx="3" fill="url(#tileGrad)" stroke="#C4BCA8" stroke-width="1"/>
    <rect x="2" y="2" width="28" height="38" rx="2" fill="none" stroke="#D5CDB8" stroke-width="0.5"/>
    <text x="16" y="30" font-family="'SimSun', 'MS Mincho', serif" font-size="22" fill="#1565C0" text-anchor="middle" font-weight="bold">東</text>
  </g>

  <!-- Right mahjong tile - 西 (West) -->
  <g transform="translate(206,120)">
    <rect x="0" y="0" width="32" height="42" rx="3" fill="url(#tileGrad)" stroke="#C4BCA8" stroke-width="1"/>
    <rect x="2" y="2" width="28" height="38" rx="2" fill="none" stroke="#D5CDB8" stroke-width="0.5"/>
    <text x="16" y="30" font-family="'SimSun', 'MS Mincho', serif" font-size="22" fill="#1565C0" text-anchor="middle" font-weight="bold">西</text>
  </g>

  <!-- Central sparrow bird -->
  <g transform="translate(150,138)">
    <!-- Bird body -->
    <ellipse cx="0" cy="8" rx="28" ry="18" fill="url(#goldGrad)" opacity="0.9"/>
    <!-- Head -->
    <circle cx="-16" cy="-14" r="14" fill="#C9A96E"/>
    <!-- Neck connection -->
    <ellipse cx="-8" cy="-4" rx="12" ry="10" fill="#C9A96E" opacity="0.9"/>
    <!-- Eye ring -->
    <circle cx="-19" cy="-17" r="4.5" fill="#1A2A1A"/>
    <circle cx="-19" cy="-17" r="3.5" fill="#0D1A0D"/>
    <!-- Eye highlight -->
    <circle cx="-20" cy="-18" r="1.2" fill="#F4ECD8"/>
    <!-- Beak -->
    <polygon points="-30,-14 -40,-11 -30,-9" fill="#8B7340" stroke="#6B5320" stroke-width="0.5"/>
    <!-- Crown/head detail -->
    <path d="M -10,-24 Q -14,-30 -18,-26 Q -16,-22 -12,-20" fill="#A8893A" opacity="0.7"/>
    <!-- Wing - main shape -->
    <path d="M -2,-2 Q 22,-20 40,-8 Q 32,4 12,12 Z" fill="#8B7340" opacity="0.9"/>
    <!-- Wing feather details -->
    <path d="M 2,0 Q 20,-16 34,-6 Q 28,4 10,10 Z" fill="#C9A96E" opacity="0.5"/>
    <path d="M 5,2 Q 18,-10 28,-4 Q 24,4 10,9 Z" fill="#E8D5A3" opacity="0.3"/>
    <!-- Tail feathers -->
    <path d="M 22,2 Q 44,-16 52,-22 Q 46,-4 28,10 Z" fill="#8B7340" opacity="0.8"/>
    <path d="M 24,5 Q 46,-12 54,-18 Q 48,0 30,12 Z" fill="#A8893A" opacity="0.5"/>
    <path d="M 26,8 Q 42,-6 48,-12 Q 44,4 30,14 Z" fill="#C9A96E" opacity="0.3"/>
    <!-- Chest feather detail -->
    <ellipse cx="-6" cy="12" rx="10" ry="6" fill="#E8D5A3" opacity="0.4"/>
    <!-- Feet/legs -->
    <line x1="-6" y1="24" x2="-10" y2="34" stroke="#8B7340" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="24" x2="3" y2="34" stroke="#8B7340" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Toes -->
    <path d="M -14,34 L -10,34 L -7,33" fill="none" stroke="#8B7340" stroke-width="1" stroke-linecap="round"/>
    <path d="M 0,33 L 3,34 L 7,33" fill="none" stroke="#8B7340" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Cherry blossom flowers -->
  <!-- Flower 1 - left side -->
  <g transform="translate(85,170)">
    <circle cx="0" cy="-6" r="4" fill="url(#flowerPink)" opacity="0.85"/>
    <circle cx="5.7" cy="-1.8" r="4" fill="url(#flowerPink)" opacity="0.85"/>
    <circle cx="3.5" cy="4.8" r="4" fill="url(#flowerPink)" opacity="0.85"/>
    <circle cx="-3.5" cy="4.8" r="4" fill="url(#flowerPink)" opacity="0.85"/>
    <circle cx="-5.7" cy="-1.8" r="4" fill="url(#flowerPink)" opacity="0.85"/>
    <circle cx="0" cy="0" r="2.5" fill="#F4ECD8"/>
    <circle cx="0" cy="0" r="1.2" fill="#E8909E" opacity="0.5"/>
  </g>

  <!-- Flower 2 - right side -->
  <g transform="translate(215,170)">
    <circle cx="0" cy="-6" r="4" fill="url(#flowerPink)" opacity="0.85"/>
    <circle cx="5.7" cy="-1.8" r="4" fill="url(#flowerPink)" opacity="0.85"/>
    <circle cx="3.5" cy="4.8" r="4" fill="url(#flowerPink)" opacity="0.85"/>
    <circle cx="-3.5" cy="4.8" r="4" fill="url(#flowerPink)" opacity="0.85"/>
    <circle cx="-5.7" cy="-1.8" r="4" fill="url(#flowerPink)" opacity="0.85"/>
    <circle cx="0" cy="0" r="2.5" fill="#F4ECD8"/>
    <circle cx="0" cy="0" r="1.2" fill="#E8909E" opacity="0.5"/>
  </g>

  <!-- Flower 3 - small bud, bottom left -->
  <g transform="translate(105,195) scale(0.7)">
    <circle cx="0" cy="-5" r="3.5" fill="url(#flowerPink)" opacity="0.7"/>
    <circle cx="4.7" cy="-1.5" r="3.5" fill="url(#flowerPink)" opacity="0.7"/>
    <circle cx="2.9" cy="4" r="3.5" fill="url(#flowerPink)" opacity="0.7"/>
    <circle cx="-2.9" cy="4" r="3.5" fill="url(#flowerPink)" opacity="0.7"/>
    <circle cx="-4.7" cy="-1.5" r="3.5" fill="url(#flowerPink)" opacity="0.7"/>
    <circle cx="0" cy="0" r="2" fill="#F4ECD8"/>
  </g>

  <!-- Flower 4 - small bud, bottom right -->
  <g transform="translate(195,195) scale(0.7)">
    <circle cx="0" cy="-5" r="3.5" fill="url(#flowerPink)" opacity="0.7"/>
    <circle cx="4.7" cy="-1.5" r="3.5" fill="url(#flowerPink)" opacity="0.7"/>
    <circle cx="2.9" cy="4" r="3.5" fill="url(#flowerPink)" opacity="0.7"/>
    <circle cx="-2.9" cy="4" r="3.5" fill="url(#flowerPink)" opacity="0.7"/>
    <circle cx="-4.7" cy="-1.5" r="3.5" fill="url(#flowerPink)" opacity="0.7"/>
    <circle cx="0" cy="0" r="2" fill="#F4ECD8"/>
  </g>

  <!-- Small flower stems/branches -->
  <path d="M 85,178 Q 90,190 105,198" fill="none" stroke="#6B8B5E" stroke-width="1" opacity="0.6"/>
  <path d="M 215,178 Q 210,190 195,198" fill="none" stroke="#6B8B5E" stroke-width="1" opacity="0.6"/>

  <!-- Small leaves near flowers -->
  <ellipse cx="92" cy="186" rx="4" ry="2" fill="#6B8B5E" opacity="0.5" transform="rotate(-30,92,186)"/>
  <ellipse cx="208" cy="186" rx="4" ry="2" fill="#6B8B5E" opacity="0.5" transform="rotate(30,208,186)"/>

  <!-- Decorative dots along inner ring -->
  <g fill="#C9A96E" opacity="0.4">
    <circle cx="150" cy="30" r="1.5"/>
    <circle cx="150" cy="270" r="1.5"/>
    <circle cx="30" cy="150" r="1.5"/>
    <circle cx="270" cy="150" r="1.5"/>
  </g>
</svg>
